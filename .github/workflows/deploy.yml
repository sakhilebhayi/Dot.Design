name: Deploy to Production

# Manual release of Dot.Design to design.infodot.co.za. Nothing deploys on a
# push: run it from the Actions tab, or
#   gh workflow run deploy.yml -f confirm=deploy
#
# INERT UNTIL SET UP. Until the host exists and the repository secrets below
# are set, a run stops in its first job ("Check the inputs") with a message
# naming the missing secret, before any test minute is spent and before
# anything reaches a server. Nothing in this repository runs it for you.
#
# Two modes, chosen by the `confirm` input:
#   adopt   ONE TIME, for a live folder that is not yet on this pipeline:
#           either an uploaded copy (no .git) or a checkout of the host's own
#           history that was never pushed (drift.yml says which; the code
#           version is unknown either way). Run drift.yml first and read it.
#           `adopt` takes a rollback copy of the whole folder, turns it
#           into a checkout of origin/main (host-only commits are kept on a
#           local host-before-adopt-* branch) WITHOUT deleting anything untracked
#           (.env, storage/, database/, uploads) and then continues as a deploy,
#           except that pending migrations are only LISTED unless `migrate` is
#           also given (the rollback copy covers a SQLite file, not Postgres).
#   deploy  Every release after that: needs the checkout on this pipeline.
#
# What a run does, in order:
#   1. CI gate (ci.yml): the PHPUnit suite (includes the design:preflight tests), the JS suite plus the Vite build
#      and manifest check, and the signed-in production-like smoke test (tests/Support/signed-in-smoke.sh).
#   2. Builds the frontend on the runner (the host has no Node), proves the manifest against every @vite entry in
#      the Blade views (scripts/ops/check-vite-manifest.mjs) and syncs it to public/build.incoming on the host.
#      Pages load their CSS and JS through @vite, so a missing manifest entry would 500 that page ("Vite manifest
#      not found", InfoDot 2026-10-17); the build step fails first. The editor, the guest pages and the signed-in
#      layout all use the manifest. No script or font is loaded from a CDN at runtime.
#   3. On the host: rollback copy of the files, a pg_dump of the database (before maintenance mode, so a failure
#      leaves the site up), maintenance mode, code to origin/main, composer install, production invariants
#      (APP_DEBUG forced false; APP_ENV forced to production; a warning, not a change, for an http APP_URL), swap
#      in the new public/build, keep the docroot's copies of build/ AND of every other static folder (fonts, images,
#      js, icons) in step, migrations, template seeding (design:seed-templates --check first; a refused template
#      fails the deploy), caches, design:preflight (a failure leaves the site down with the reason), back up.
#   4. Installs TWO cron lines through the shared crontab block, with its
#      lock and verified read-back (first run: the account total grows by 2):
#        schedule:run  every minute; routes/console.php schedules the daily token-drift scan, the daily
#                      Dot.Analytics snapshot (design:publish-metrics, 00:10 UTC) and the daily pruning of old
#                      assistant proposals (design:prune-ai-proposals, 03:30).
#        queue:work --stop-when-empty --tries=3 --max-time=50  every minute, the
#                      cPanel way (cron-driven, not a daemon), because QUEUE_CONNECTION=database. Queued work:
#                      the Dot.Notify listener (App\Listeners\Integrations\SendDesignNotifications, only while
#                      the integration is on) and App\Jobs\SendAnalyticsSnapshot. Everything uses the default
#                      queue, so the worker needs no --queue argument. While those integrations are off the
#                      worker simply finds nothing to do.
#   5. Smoke check from the runner, like a browser: / , /login and /up answer 200; the built assets, the
#      self-hosted fonts and one file of every static folder answer 200 (proves the docroot serves them);
#      /design/new redirects to the login; a bogus /s/<token> answers the neutral 404 with no cookie; the security
#      headers are present; a 9 MB POST is not refused by post_max_size (a warning, not a failure); and a
#      harmless POST /up (a 405) does not return a debug page. The live host has no seeded user, so the
#      signed-in pages are covered by the CI smoke job, not here.
#
# A failure after maintenance mode starts LEAVES the site down on purpose, with
# the rollback copy's name in the log, rather than guessing at an automatic
# rollback (the Dot.Agents pipeline's rollback fired after failures that never
# touched the server). Re-run the same workflow once the cause is fixed; it
# brings the site back up itself. A failure BEFORE maintenance mode (the gate,
# the build, ssh, the upload, the rollback copy) leaves the live site on the
# previous release. A failure in the smoke check means the release is in place
# but something is wrong: read the log, do not assume the site is healthy.
#
# Reverb: composer.json requires laravel/reverb and .env.example says
# BROADCAST_CONNECTION=reverb, but nothing in Dot.Design on main or on any open PR
# tip broadcasts an event or starts Echo, so no WebSocket server is needed.
# Reverb is a long-running process and shared cPanel cannot run one: this
# pipeline NEVER starts, restarts or reloads it. If a realtime feature is added
# later it will degrade (no live updates) until Reverb runs somewhere else.
#
# Repository secrets: DEPLOY_HOST (design.infodot.co.za), DEPLOY_USER,
# DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS. DEPLOY_PATH is optional: left unset, the
# app folder is found as the one `artisan` under the docroot ~/<DEPLOY_HOST>.
# docs/deployment.md has the whole first-deploy checklist.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" for a release, or "adopt" for the one-time takeover of the hand-uploaded folder'
        required: true
      migrate:
        description: 'adopt only: type "migrate" to also run pending migrations (a normal deploy always migrates)'
        required: false
      skip_db_dump:
        description: 'type "skip" to deploy WITHOUT the pre-migration pg_dump (only if the host has no pg_dump and you took your own dump)'
        required: false

concurrency:
  group: design-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://design.infodot.co.za
  REPO_URL: https://github.com/sakhilebhayi/Dot.Design.git

jobs:
  confirm:
    name: Check the inputs
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.in.outputs.mode }}
      migrate: ${{ steps.in.outputs.migrate }}
      skipdump: ${{ steps.in.outputs.skipdump }}
    steps:
      - id: in
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          MIGRATE_INPUT: ${{ github.event.inputs.migrate }}
          SKIP_DUMP_INPUT: ${{ github.event.inputs.skip_db_dump }}
          HAVE_HOST: ${{ secrets.DEPLOY_HOST != '' }}
          HAVE_USER: ${{ secrets.DEPLOY_USER != '' }}
          HAVE_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAVE_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          case "$CONFIRM" in
            deploy|adopt) ;;
            *) echo '::error::Confirmation input must be exactly "deploy" or "adopt" -- aborting.'; exit 1 ;;
          esac
          # Only the names of missing secrets are printed, never a value.
          MISSING=""
          [ "$HAVE_HOST" = "true" ] || MISSING="$MISSING DEPLOY_HOST"
          [ "$HAVE_USER" = "true" ] || MISSING="$MISSING DEPLOY_USER"
          [ "$HAVE_KEY" = "true" ] || MISSING="$MISSING DEPLOY_SSH_KEY"
          [ "$HAVE_KNOWN_HOSTS" = "true" ] || MISSING="$MISSING DEPLOY_KNOWN_HOSTS"
          if [ -n "$MISSING" ]; then
            echo "::error::Repository secret(s) not set:$MISSING. The host is not set up for this pipeline yet; see docs/deployment.md. Nothing was run."
            exit 1
          fi
          echo "mode=$CONFIRM" >> "$GITHUB_OUTPUT"
          # A normal release always migrates; the takeover only on request.
          if [ "$CONFIRM" = "deploy" ] || [ "$MIGRATE_INPUT" = "migrate" ]; then
            echo "migrate=yes" >> "$GITHUB_OUTPUT"
          else
            echo "migrate=no" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SKIP_DUMP_INPUT" = "skip" ]; then echo "skipdump=yes" >> "$GITHUB_OUTPUT"; else echo "skipdump=no" >> "$GITHUB_OUTPUT"; fi

  checks:
    name: CI gate
    needs: confirm
    uses: ./.github/workflows/ci.yml

  deploy:
    name: ${{ needs.confirm.outputs.mode }} design.infodot.co.za
    needs: [confirm, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # No .env exists on the runner, so no VITE_* variable (for example
      # VITE_REVERB_APP_KEY) is baked into the bundle: the browser code ships
      # with its optional features off. Production values belong in the HOST
      # .env only if a rebuild is meant to bake them, which this pipeline
      # deliberately does not do.
      - name: Build the frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s public/build/manifest.json
          # The guest layout asks @vite for exactly these two entries.
          python3 - <<'PY'
          import json, sys
          m = json.load(open('public/build/manifest.json'))
          missing = [e for e in ('resources/css/app.css', 'resources/js/app.js') if e not in m]
          if missing:
              print('::error::manifest.json lacks ' + ', '.join(missing) + ': /login would answer 500 (Vite manifest entry not found)')
              sys.exit(1)
          print('manifest entries present: resources/css/app.css, resources/js/app.js')
          PY
          # Every @vite entry named in a Blade view is in the manifest, every manifest file exists, and no view that
          # uses @vite names a resources/ path that is not a real entry (a comment did that to Dot.Auction's deploy).
          node scripts/ops/check-vite-manifest.mjs

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Locate the app on the host
        # DEPLOY_PATH is optional. Without it the app is found as the single
        # `artisan` within two levels of the docroot ~/<DEPLOY_HOST>; zero or
        # several is an error, not a guess.
        run: |
          APP="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$APP" ]; then
            APP="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
                "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
                SITE="${{ secrets.DEPLOY_HOST }}" \
                'bash -s' <<'FIND'
          set -euo pipefail
          D="$HOME/$SITE"
          A="$(find "$D" -maxdepth 2 -name artisan -type f -exec dirname {} \; | sort -u)"
          if [ "$(printf '%s\n' "$A" | grep -c .)" != 1 ]; then
            echo "expected exactly one Laravel app under the docroot, found: ${A:-none}" >&2
            exit 1
          fi
          printf '%s\n' "$A"
          FIND
            )"
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "App directory: ${APP#/home/}"

      # Staged beside the live build so the swap on the host is two renames,
      # and a failed upload leaves the running site untouched.
      - name: Upload the built frontend (staged)
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            public/build/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$APP_PATH/public/build.incoming/"

      - name: Deploy the code
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$APP_PATH" \
              MODE="${{ needs.confirm.outputs.mode }}" \
              MIGRATE="${{ needs.confirm.outputs.migrate }}" \
              SKIP_DB_DUMP="${{ needs.confirm.outputs.skipdump }}" \
              REPO_URL="$REPO_URL" \
              'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          DOCROOT="$(dirname "$DEPLOY_PATH")"
          APPDIR="$(basename "$DEPLOY_PATH")"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"

          [ -f .env ] || { echo "::error::$DEPLOY_PATH has no .env. This pipeline updates a LIVE install; a first install needs its own bootstrap."; exit 1; }
          [ -d public/build.incoming ] || { echo "::error::the staged frontend (public/build.incoming) is missing -- the upload step did not run."; exit 1; }

          # ---- rollback copy, outside every web root; the newest three are kept
          BACKUP="$HOME/dot-design-$MODE-$STAMP.tgz"
          tar czf "$BACKUP" --exclude=./vendor --exclude=./node_modules --exclude=./storage/logs --exclude=./public/build --exclude=./public/build.incoming .
          chmod 600 "$BACKUP"
          ls -1t "$HOME"/dot-design-*.tgz | tail -n +4 | xargs -r rm -f
          echo "== Rollback copy: $BACKUP ($(du -h "$BACKUP" | cut -f1))  [restore: stop writes, tar xzf it over $DEPLOY_PATH]"

          # ---- database rollback copy, BEFORE maintenance mode and before any migration
          # The tar above holds no PostgreSQL data. R-45 adds 17 tables, columns and two backfills, so a restore point
          # for the database is taken here, from the credentials in the host .env. Failing here leaves the live site
          # on the previous release (maintenance mode has not started). Custom format: restore with
          #   pg_restore --clean --if-exists --no-owner -d <database> <file>      (docs/R45_OPERATIONS.md)
          envval() { { grep -E "^$1=" .env || true; } | tail -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"; }
          DBC="$(envval DB_CONNECTION)"
          if [ "$DBC" = "pgsql" ]; then
            if [ "$SKIP_DB_DUMP" = "yes" ]; then
              echo "::warning::skip_db_dump=skip: NO database dump was taken by this run. Make sure you have your own."
            elif ! command -v pg_dump >/dev/null 2>&1; then
              echo "::error::pg_dump is not installed for this account, so no database restore point can be taken. Take your own dump, then run again with skip_db_dump=skip. The live site is untouched."; exit 1
            else
              DBDUMP="$HOME/dot-design-db-$MODE-$STAMP.dump"
              if ! PGPASSWORD="$(envval DB_PASSWORD)" pg_dump --format=custom --no-owner --file="$DBDUMP" \
                   --host="$(envval DB_HOST)" --port="$(envval DB_PORT)" --username="$(envval DB_USERNAME)" "$(envval DB_DATABASE)"; then
                rm -f "$DBDUMP"
                echo "::error::pg_dump failed (see above), so no database restore point exists. The live site is untouched. Fix the cause, or take your own dump and run again with skip_db_dump=skip."; exit 1
              fi
              chmod 600 "$DBDUMP"
              ls -1t "$HOME"/dot-design-db-*.dump | tail -n +4 | xargs -r rm -f
              echo "== Database restore point: $DBDUMP ($(du -h "$DBDUMP" | cut -f1))  [restore: pg_restore --clean --if-exists --no-owner -d <database> <file>]"
            fi
          else
            echo "== Database is '$DBC', not pgsql: no pg_dump taken (a SQLite file is inside the rollback copy above)."
          fi

          # ---- keep the application folder from being served over HTTP
          # 2026-10-20: platforms whose pipeline never wrote this file served their
          # app folder (~/<host>/<key>/, next to the docroot): the live SQLite
          # database, storage/logs/laravel.log, composer files, vendor/autoload.php.
          # Written HERE, before any `artisan down`, so that a mistake in this block
          # can never leave the site in maintenance mode: it is tolerant (set +e), prints
          # one line and never fails the deploy. The file is untracked, so the
          # `git reset --hard` below does not remove it; an existing .htaccess is kept
          # as .htaccess.before-guard. Skipped when this folder does not look like an
          # app folder under a docroot (then .htaccess here would be the site's own).
          DOCROOT_IS_PUBLIC=0
          set +e
          # Once the subdomain's document root is <app>/public (the docroot move, InfoDot docs S-2e) the app
          # folder is not served at all, and a deny file in it would block the whole site: do not write one.
          # The host's own answer decides; a marker file is the fallback if the lookup fails.
          APP_REAL="$(cd "$DEPLOY_PATH" 2>/dev/null && pwd -P)" || APP_REAL=""
          CURRENT_DOCROOT="$(uapi --output=json DomainInfo single_domain_data domain=design.infodot.co.za 2>/dev/null | sed -n 's/.*"documentroot" *: *"\([^"]*\)".*/\1/p' | head -1)"
          if [ -n "$APP_REAL" ] && { [ "$CURRENT_DOCROOT" = "$APP_REAL/public" ] || [ -f "$DEPLOY_PATH/.docroot-is-public" ]; }; then
            echo "== app-folder guard: skipped (the document root is $APP_REAL/public; the app folder is not served)"
            DOCROOT_IS_PUBLIC=1
          elif [ "$DOCROOT" = "$HOME" ] || [ -e index.php ] || [ ! -f artisan ] || [ ! -f public/index.php ]; then
            echo "== app-folder guard: skipped ($APPDIR is not an app folder under a docroot)"
          elif [ -f .htaccess ] && grep -q 'Require all denied' .htaccess; then
            echo "== app-folder guard: already present in $APPDIR/.htaccess"
          elif [ -f .htaccess ]; then
            if cp .htaccess .htaccess.before-guard && printf '\n# Dot: the application folder is never served.\nRequire all denied\n' >> .htaccess; then
              echo "== app-folder guard: appended to $APPDIR/.htaccess (original kept as .htaccess.before-guard)"
            else
              echo "::warning::app-folder guard: could not append to $APPDIR/.htaccess; the deploy goes on"
            fi
          else
            if printf '# Dot: the application folder is never served.\nRequire all denied\n' > .htaccess; then
              echo "== app-folder guard: written $APPDIR/.htaccess (new file)"
            else
              echo "::warning::app-folder guard: could not write $APPDIR/.htaccess; the deploy goes on"
            fi
          fi
          set -e

          # A failure leaves the site exactly as it is -- DOWN if maintenance
          # mode had started -- and says which, with the way back.
          trap 'if [ -f storage/framework/down ]; then echo "::error::The deploy failed AFTER maintenance mode started. The site was left DOWN on purpose. Rollback copy: $BACKUP. Inspect with server-logs.yml and run again, or restore the copy and run: php artisan up"; else echo "::error::The deploy failed BEFORE maintenance mode started; the site is still serving the previous release. Rollback copy: $BACKUP."; fi' ERR

          # Git hooks on the host never run during a release. The Forms host's old
          # checkout carried a Git LFS post-checkout hook but no git-lfs, so its
          # first adopt died on `git checkout` AFTER maintenance mode started.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null

          # ---- code
          if [ ! -d .git ]; then
            if [ "$MODE" != "adopt" ]; then
              echo "::error::$DEPLOY_PATH is not a git checkout yet. Run drift.yml, read it, then run this workflow once with confirm=adopt."; exit 1
            fi
            $PHP artisan down --retry=30 || true
            git init -q
            git remote add origin "$REPO_URL"
            git fetch -q origin main
            git reset -q origin/main
            echo "== Tracked files that differ on the host (replaced by main; copies are in the rollback tar):"
            git status --short | grep -v '^??' || echo "   (none)"
            git checkout -q -- .
            git checkout -q -B main origin/main
          else
            echo "== Current release: $(git rev-parse --short HEAD)"
            if [ "$MODE" = "adopt" ]; then
              # The folder is already a checkout, but of the host's own history
              # (commits that were never pushed). Keep that history on a branch
              # before main replaces the files, so nothing is lost even if the
              # rollback copy is later deleted.
              KEEP="host-before-adopt-$STAMP"
              git branch -f "$KEEP" HEAD
              echo "== Host history kept on local branch $KEEP (also inside the rollback copy)."
              echo "== Remote before: $(git remote get-url origin 2>/dev/null | sed 's#//[^@/]*@#//#' || echo none)"
              if git remote get-url origin >/dev/null 2>&1; then git remote set-url origin "$REPO_URL"; else git remote add origin "$REPO_URL"; fi
              echo "== Tracked files that differ or are deleted on the host (replaced by main; copies are in the rollback tar):"
              git status --short | grep -v '^??' | head -40 || echo "   (none)"
            fi
            git fetch -q origin main
            $PHP artisan down --retry=30 || true
            git reset --hard origin/main
            git checkout -q -B main origin/main
          fi
          echo "== Code: $(git rev-parse --short HEAD)"

          # ---- files on the host that main does not have
          # Untracked files survive a takeover on purpose (.env, uploads, local
          # state), so say what they are instead of only counting them.
          UNTRACKED="$(git ls-files --others --exclude-standard | grep -vE '^(storage/|bootstrap/cache/|public/build|database/[^/]*[.]sqlite)' || true)"
          if [ -n "$UNTRACKED" ]; then
            echo "== Files on the host that main does not have (kept; first 40):"
            printf '%s\n' "$UNTRACKED" | head -40 | sed 's/^/   /'
          fi
          # A host-only MIGRATION is the exception: `migrate` would run it next to
          # main's own files. On the real Dot.Projects host a leftover
          # 2026_06_27_000001_create_projects_table sorts before main's
          # create_projects migration, which is not guarded by hasTable, so a
          # normal deploy would fail AFTER maintenance mode started (reproduced on a
          # fake host). Move such files aside, never delete them; they are also
          # in the rollback copy.
          ORPHANS="$(git ls-files --others --exclude-standard -- database/migrations || true)"
          if [ -n "$ORPHANS" ]; then
            QUARANTINE="$HOME/dot-design-quarantine-$STAMP"
            mkdir -p "$QUARANTINE"
            printf '%s\n' "$ORPHANS" | while IFS= read -r f; do mv "$f" "$QUARANTINE/"; done
            echo "== Moved host-only migration file(s) aside (not in main; they would run beside main's own):"
            printf '%s\n' "$ORPHANS" | sed 's/^/   /'
            echo "   now in $QUARANTINE"
          fi

          composer install --no-interaction --optimize-autoloader --no-dev

          # ---- production invariants
          # APP_DEBUG=true makes any error, even a harmless 405, answer every
          # visitor with a ~840 KB debug page (ecosystem audit D9). Forced off
          # BEFORE the config cache is built so a hand-edited .env cannot put
          # it back.
          if grep -q '^APP_DEBUG=' .env; then
            sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          else
            printf '\nAPP_DEBUG=false\n' >> .env
          fi
          echo "== APP_DEBUG forced to false: $(grep '^APP_DEBUG=' .env | tail -1)"
          # APP_ENV=local on a live site mislabels errors and lets any package that
          # branches on the environment behave as in development. Dot.Design's own code
          # never branches on it (checked on main and on every open PR tip: no
          # environment() or isLocal() anywhere in app/, config/, routes/,
          # resources/), so forcing it is safe here, as APP_DEBUG is above.
          if grep -q '^APP_ENV=' .env; then
            sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
          else
            printf '\nAPP_ENV=production\n' >> .env
          fi
          echo "== APP_ENV forced to production: $(grep '^APP_ENV=' .env | tail -1)"
          if grep -qE '^APP_URL=http://' .env; then echo "::warning::APP_URL is http://, not https://; set it to the https address."; fi
          # ---- frontend: swap the staged build in, keep the docroot copy in step
          # public/build is gitignored, so git never refreshes it. The docroot
          # may serve its own build/ (a symlink, or on this host sometimes a
          # separate copy: Dot.Doc 404'd assets for days that way), and the
          # browser reads THAT one while @vite reads this app's manifest.
          rm -rf public/build.old
          [ -d public/build ] && mv public/build public/build.old
          mv public/build.incoming public/build
          rm -rf public/build.old
          LINK="$DOCROOT/build"
          if [ -L "$LINK" ]; then
            echo "== docroot build/ is a symlink; nothing to copy"
          elif [ -d "$LINK" ]; then
            rsync -a --delete public/build/ "$LINK/"
            echo "== docroot build/ is a real directory; mirrored from public/build"
          else
            ln -s "$APPDIR/public/build" "$LINK"
            echo "== docroot build/ did not exist; linked to $APPDIR/public/build"
          fi

          # ---- the other static folders: public/fonts (55 editor fonts + the interface fonts), images, js, icons
          # Same trap as build/: the docroot may hold COPIES of public/ files that git never refreshes (InfoDot R-17,
          # the Dopemine pilot). Every top-level entry of public/ except the build folders, index.php, .htaccess, hot
          # and storage is kept in step, so a new static folder is picked up without editing this workflow:
          #   a folder  - missing in the docroot: linked to <app>/public/<name>; a symlink: left alone; a real folder:
          #               rsync -a (adds and overwrites the files the app ships, DELETES nothing);
          #   a file    - missing in the docroot: linked; present and equal or a symlink: left alone; present and
          #               different: NOT overwritten (the docroot's copy may be hand-managed), a warning names it.
          # Nothing under storage/ is ever synced: uploaded designs live on the private disk
          # (storage/app/private/design-assets) and must never be reachable from the docroot.
          if [ "$DOCROOT_IS_PUBLIC" = "1" ]; then
            echo "== static folders: the document root is $APPDIR/public itself; nothing to sync"
          else
            for ENTRY in $(cd public && ls -A); do
              case "$ENTRY" in
                build|build.incoming|build.old|index.php|.htaccess|hot|storage|.gitignore|.DS_Store) continue ;;
              esac
              SRC="public/$ENTRY"; DST="$DOCROOT/$ENTRY"
              if [ -d "$SRC" ] && [ ! -L "$SRC" ]; then
                if [ -L "$DST" ]; then echo "== static $ENTRY/: docroot entry is a symlink; nothing to copy"
                elif [ -d "$DST" ]; then
                  rsync -a "$SRC/" "$DST/"
                  echo "== static $ENTRY/: docroot is a real directory; mirrored from public/$ENTRY (nothing deleted)"
                elif [ -e "$DST" ]; then echo "::warning::static $ENTRY: $DST exists and is not a directory; left alone"
                else
                  ln -s "$APPDIR/public/$ENTRY" "$DST"
                  echo "== static $ENTRY/: did not exist in the docroot; linked to $APPDIR/public/$ENTRY"
                fi
              else
                if [ -L "$DST" ]; then :
                elif [ ! -e "$DST" ]; then
                  ln -s "$APPDIR/public/$ENTRY" "$DST"
                  echo "== static file $ENTRY: linked into the docroot"
                elif ! cmp -s "$SRC" "$DST"; then echo "::warning::static file $ENTRY differs from $DST in the docroot and was NOT overwritten; compare them by hand"
                fi
              fi
            done
          fi

          # ---- private storage the app writes to (never under the docroot)
          mkdir -p storage/app/private/design-assets storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

          # ---- database
          echo "== Pending migrations:"
          $PHP artisan migrate:status --pending 2>&1 | tail -25 || true
          if [ "$MIGRATE" = "yes" ]; then
            $PHP artisan migrate --force
            # ---- reference data: the curated templates (idempotent upsert by slug). --check validates every
            # definition and writes nothing; a refused template stops the deploy BEFORE anything is written.
            if ! $PHP artisan design:seed-templates --check; then
              echo "::error::design:seed-templates --check refused one or more templates (listed above). The site stays in maintenance mode. Fix the definition files and run again."; exit 1
            fi
            # The real seed exits non-zero only for a slug that someone saved as their own template; those are skipped
            # (never overwritten) and reported. That is a data note, not a broken release, so it warns and goes on.
            if ! $PHP artisan design:seed-templates; then
              echo "::warning::design:seed-templates skipped one or more templates whose slug belongs to a saved template (see above). Rename the slug in the definition file."
            fi
          else
            echo "== Migrations NOT run (takeover). Read the list above; the next confirm=deploy runs them, or re-run with migrate=migrate."
          fi

          # Targeted clears, NOT optimize:clear: that also empties the cache
          # store, which here is the database. If the host database lacks the
          # cache table the deploy would crash with the site in maintenance
          # mode (found by running this script against a fake host), and a
          # release has no business flushing sessions' companions anyway.
          $PHP artisan config:clear
          $PHP artisan route:clear
          $PHP artisan view:clear
          $PHP artisan event:clear
          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache
          $PHP artisan schedule:list

          # ---- the environment, the data and the build, judged by the app itself. FAIL lines stop the release with
          # the site still in maintenance mode; WARN, INFO and OFF lines (optional integrations that are switched
          # off) never do. Skipped on a takeover that did not migrate: the schema is knowingly behind then.
          if [ "$MIGRATE" = "yes" ]; then
            if ! $PHP artisan design:preflight; then
              echo "::error::design:preflight reported FAIL lines (above). The site stays in maintenance mode on purpose. Fix the cause (usually .env or a PHP extension in cPanel) and run the workflow again; it brings the site back up itself. Rollback copy: $BACKUP."; exit 1
            fi
          else
            echo "== design:preflight skipped: this takeover did not run migrations."
          fi

          $PHP artisan up
          trap - ERR
          echo "== Deployed: $(git rev-parse --short HEAD)"
          DEPLOY

      - name: Install the scheduler cron lines
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$APP_PATH" \
              'bash -s' <<'CRON'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          # ---- crontab: repair this app's lines, never touch anyone else's ----
          # Rule for this account: the crontab is written only by deploy
          # workflows, each touches only lines carrying its own marker, and a
          # write is verified before and after. 2026-08-31: a pipeline whose read
          # failed installed an EMPTY crontab and silently killed Dot.Mines'
          # scheduler for six weeks. cron runs with a minimal PATH, so lines carry
          # the absolute PHP path and keep their last output in a log file.
          MARK="# dot-design"
          # Spread the load on the shared account. 43 cron lines used to fire in the same second and
          # the host answered "fork: Resource temporarily unavailable" (2026-10-19), so scheduler and
          # queue runs started late or not at all. `exec` drops the sh parent (one process per line instead
          # of two); the queue worker runs every second minute, on this app's own parity, so about half
          # of the workers start in any given minute. A queued job waits at most about two minutes.
          QMIN="$(( $(printf %s "$MARK" | cksum | cut -d" " -f1) % 2 ))-59/2"
          # One writer at a time on this account: deploys of different apps can
          # coincide and would otherwise race on the single crontab.
          command -v flock > /dev/null || { echo "::error::flock is not installed on the host; crontab writes cannot be serialised"; exit 1; }
          exec 9>"$HOME/.dot-crontab.lock"; flock -w 120 9 || { echo "::error::could not take the crontab lock within 120 s (another deploy is writing the crontab)"; exit 1; }
          PHP_BIN="$(command -v "${PHP:-php}")"
          OLD="$(mktemp)"; NEW="$(mktemp)"; CHK="$(mktemp)"; ERR="$(mktemp)"
          # crontab -l on this host can transiently answer empty (seen 2026-10-16,
          # right after a write, under the lock). A read is trusted only when it
          # is non-empty or the host says there is no crontab; otherwise retry.
          read_crontab() {
            local _
            for _ in 1 2 3 4 5; do
              if crontab -l > "$1" 2> "$ERR"; then
                [ -s "$1" ] && return 0
              elif grep -qi "no crontab for" "$ERR"; then
                : > "$1"; return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! read_crontab "$OLD"; then
            echo "::error::crontab -l answered empty or failed five times ($(cat "$ERR")). Refusing to write a crontab I could not read."; exit 1
          fi
          KEY="${MARK#\# dot-}"
          EXPECT_MINE=2
          OTHERS=$(grep -v "$MARK" "$OLD" | grep -c . || true)
          {
            grep -v "$MARK" "$OLD" || true
            echo "* * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan schedule:run > storage/logs/cron-scheduler.log 2>&1 $MARK"
            echo "$QMIN * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan queue:work --stop-when-empty --tries=3 --max-time=50 > storage/logs/cron-queue.log 2>&1 $MARK"
          } > "$NEW"
          # Runner mode (docs/programme/REMEDIATION_ROADMAP.md, R-1): when the account runs the bounded-concurrency
          # cron runner (InfoDot: Cron Runner workflow, "install"), this app's commands go to ~/.dot-cron.d/$KEY.cron
          # and the runner starts them, at most 4 at a time. Its own crontab lines are then removed (a migration on
          # deploy). Without the runner the crontab lines above are installed exactly as before.
          if [ -x "$HOME/bin/dot-cron-runner" ] && grep -q '# dot-cron-runner' "$OLD"; then
            CMDS="$(grep -F -- "$MARK" "$NEW" | sed -E 's/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ //; s/ *# dot-[a-z0-9-]*$//' || true)"
            mkdir -p "$HOME/.dot-cron.d"
            if [ -n "$CMDS" ]; then
              printf '%s\n' "$CMDS" > "$HOME/.dot-cron.d/$KEY.cron.tmp" && mv "$HOME/.dot-cron.d/$KEY.cron.tmp" "$HOME/.dot-cron.d/$KEY.cron"
            else
              rm -f "$HOME/.dot-cron.d/$KEY.cron"
            fi
            grep -v -F -- "$MARK" "$NEW" > "$NEW.t" || true; mv "$NEW.t" "$NEW"
            EXPECT_MINE=0
            echo "== runner mode: $(printf '%s' "$CMDS" | grep -c . || true) command(s) written to ~/.dot-cron.d/$KEY.cron, none left in the crontab"
          fi
          crontab "$NEW"
          read_crontab "$CHK" || : > "$CHK"
          AFTER=$(grep -v "$MARK" "$CHK" | grep -c . || true)
          MINE=$(grep -c "$MARK" "$CHK" || true)
          if [ "$AFTER" != "$OTHERS" ] || [ "$MINE" != "$EXPECT_MINE" ]; then
            crontab "$OLD"
            echo "::error::crontab verification failed (other lines before=$OTHERS after=$AFTER, mine=$MINE, expected=$EXPECT_MINE); the previous crontab was restored."; exit 1
          fi
          rm -f "$OLD" "$NEW" "$CHK" "$ERR"; flock -u 9
          echo "== crontab: $MINE line(s) for $MARK installed, $OTHERS other line(s) preserved"
          CRON
      - name: Smoke-check the live site
        run: |
          set -uo pipefail
          WORK="$(mktemp -d)"
          FAILED=0
          for PAGE in "/" "/login" "/up"; do
            CODE=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$SITE_URL$PAGE" || true)
            if [ "$CODE" = "200" ]; then echo "200 $SITE_URL$PAGE"; else echo "::error::$SITE_URL$PAGE answered ${CODE:-no response} (expected 200)"; FAILED=1; fi
          done
          for ASSET in $(python3 -c "import json; m=json.load(open('public/build/manifest.json')); print(' '.join(sorted({v['file'] for v in m.values() if v.get('isEntry')} | {f for v in m.values() if v.get('isEntry') for f in v.get('css', [])})))"); do
            CODE=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$SITE_URL/build/$ASSET" || true)
            if [ "$CODE" = "200" ]; then echo "200 $SITE_URL/build/$ASSET"; else echo "::error::$SITE_URL/build/$ASSET answered ${CODE:-no response} (expected 200): the docroot is not serving the new build"; FAILED=1; fi
          done
          # A GET-only route answering POST is a harmless 405: ~1 KB in
          # production, an ~840 KB stack-trace page when APP_DEBUG is on.
          curl -s --max-time 30 -o "$WORK/probe.html" -X POST "$SITE_URL/up" || true
          if grep -qiE 'vendor/laravel|stack trace' "$WORK/probe.html"; then
            echo "::error::POST $SITE_URL/up answered with a debug error page: APP_DEBUG is still on."; FAILED=1
          else
            echo "No debug page on POST $SITE_URL/up ($(wc -c < "$WORK/probe.html" | tr -d ' ') bytes)"
          fi

          # ---- signed-out behaviour that depends on the whole app being wired correctly
          # /design/new is behind the sign-in: a guest is redirected to the login (a 200 would mean the auth
          # middleware is gone, a 500 that routes are broken).
          curl -s --max-time 30 -D "$WORK/h" -o /dev/null "$SITE_URL/design/new" || true
          if head -1 "$WORK/h" | grep -qE ' 30[12] ' && grep -qi '^location:.*/login' "$WORK/h"; then echo "302 /design/new -> /login"; else echo "::error::/design/new did not redirect a guest to /login: $(head -1 "$WORK/h" | tr -d '\r')"; FAILED=1; fi
          # A share link that does not exist answers the same plain 404 as an expired one, and sets no cookie (the
          # public routes run without a session).
          BOGUS="$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 40)"
          CODE=$(curl -s --max-time 30 -D "$WORK/h" -o "$WORK/b" -w '%{http_code}' "$SITE_URL/s/$BOGUS" || true)
          if [ "$CODE" != "404" ]; then echo "::error::/s/<unknown token> answered ${CODE:-no response}, expected 404"; FAILED=1
          elif grep -qi '^set-cookie:' "$WORK/h"; then echo "::error::/s/<unknown token> set a cookie; the public share routes must not start a session"; FAILED=1
          elif grep -qiE 'stack trace|vendor/laravel' "$WORK/b"; then echo "::error::/s/<unknown token> leaks internals"; FAILED=1
          else echo "404 /s/<unknown token>, no cookie, nothing leaked"; fi
          # Security headers (config/security.php, SecurityHeaders middleware) on a guest page.
          curl -s --max-time 30 -D "$WORK/h" -o /dev/null "$SITE_URL/login" || true
          for HDR in x-content-type-options x-frame-options referrer-policy 'content-security-policy(-report-only)?'; do
            if grep -Eqi "^$HDR:" "$WORK/h"; then echo "header $HDR present"; else echo "::error::header $HDR missing on /login"; FAILED=1; fi
          done

          # ---- fonts and the other static folders: prove the DOCROOT serves them (not just the app folder)
          # A real font answers 200, is not an HTML page, and starts with the woff2 magic bytes.
          FONTS="/fonts/design/inter/inter-400.woff2"
          for F in $(cd public && ls fonts/ui/*.woff2 2>/dev/null); do FONTS="$FONTS /$F"; done
          for F in $FONTS; do
            CODE=$(curl -s --max-time 30 -D "$WORK/h" -o "$WORK/f" -w '%{http_code}' "$SITE_URL$F" || true)
            CT=$(grep -i '^content-type:' "$WORK/h" | tail -1 | tr -d '\r' | tr '[:upper:]' '[:lower:]')
            if [ "$CODE" = "200" ] && [ "$(head -c4 "$WORK/f")" = "wOF2" ] && ! echo "$CT" | grep -q 'text/html'; then echo "200 $SITE_URL$F (${CT#content-type: })"
            else echo "::error::$SITE_URL$F answered ${CODE:-no response} / $CT / not a woff2 file: the docroot is not serving the fonts"; FAILED=1; fi
          done
          # One file from every static folder (and every static root file) the checkout ships.
          for ENTRY in $(cd public && ls -A); do
            case "$ENTRY" in build|build.incoming|build.old|index.php|.htaccess|hot|storage|.gitignore|.DS_Store) continue ;; esac
            if [ -d "public/$ENTRY" ]; then PROBE="$ENTRY/$(cd "public/$ENTRY" && find . -type f ! -name 'LICEN*' ! -name '.*' | sort | head -1 | sed 's#^\./##')"; else PROBE="$ENTRY"; fi
            CODE=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$SITE_URL/$PROBE" || true)
            if [ "$CODE" = "200" ]; then echo "200 $SITE_URL/$PROBE"; else echo "::error::$SITE_URL/$PROBE answered ${CODE:-no response} (expected 200): the docroot does not serve public/$ENTRY"; FAILED=1; fi
          done
          # The private asset store must not be reachable from the web.
          for P in storage/app/private/design-assets storage/app/private storage/app/private/design-assets/.gitignore; do
            CODE=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' "$SITE_URL/$P" || true)
            if [ "$CODE" = "200" ]; then echo "::error::$SITE_URL/$P answered 200: private storage is exposed"; FAILED=1; else echo "${CODE:-000} /$P (not served)"; fi
          done

          # ---- host requirement, not failures: cache headers and request-size limits
          FIRST="$(python3 -c "import json; m=json.load(open('public/build/manifest.json')); print(sorted({v['file'] for v in m.values() if v.get('isEntry')})[0])")"
          curl -sI --max-time 30 "$SITE_URL/build/$FIRST" > "$WORK/h" || true
          CC=$(grep -i '^cache-control:' "$WORK/h" | tr -d '\r' | tail -1)
          if echo "$CC" | grep -qi 'immutable' || echo "$CC" | grep -Eqi 'max-age=([0-9]{7,})'; then echo "hashed assets are cached long: ${CC#*: }"; else echo "::warning::/build/$FIRST is served with '${CC:-no cache-control}': hashed assets and fonts should be 'public, max-age=31536000, immutable' (docs/deployment.md, 'Cache headers'). Slower repeat visits, nothing broken."; fi
          # An 8 MB upload needs post_max_size above 8 MB. /csp-report reads at most 8 KB and answers 204, and Laravel
          # refuses an oversized body with 413 before the route runs, so this measures the real web stack.
          head -c 9437184 /dev/zero > "$WORK/big"
          CODE=$(curl -s --max-time 60 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/csp-report' --data-binary @"$WORK/big" "$SITE_URL/csp-report" || true)
          if [ "$CODE" = "413" ]; then echo "::warning::A 9 MB POST was refused with 413: post_max_size (or the web server's body limit) is below 9 MB, so images near the 8 MB limit cannot be uploaded. Set post_max_size and upload_max_filesize to 10M in cPanel, MultiPHP INI Editor."
          else echo "9 MB POST not refused for size (answered ${CODE:-no response})"; fi

          rm -rf "$WORK"
          [ "$FAILED" -eq 0 ] || { echo "::error::Smoke check failed: the deploy is NOT healthy."; exit 1; }
          echo "== Smoke check passed."

      # Public probe, from the runner: does the application folder answer over HTTP?
      # Runs after `artisan up` (and after the smoke check), so it can only turn the run
      # red; it never touches the host. Only status codes are printed. 200 = a file is
      # being served (301/302 is the app routing an unknown path to its login; 403/404 is fine).
      - name: Probe the app folder from outside
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          KEY="$(basename "${APP_PATH:-}")"
          case "$KEY" in
            ""|"/"|*.*) echo "::warning::app-folder probe skipped: the app folder name is [$KEY], not a folder key under the docroot."; exit 0 ;;
          esac
          BAD=0
          for P in .env .env.bak-secrets artisan composer.json composer.lock database/database.sqlite storage/logs/laravel.log vendor/autoload.php phpunit.xml; do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$SITE_URL/$KEY/$P" || true)
            if [ "$CODE" = "200" ]; then echo "EXPOSED 200 /$KEY/$P"; BAD=1; else echo "${CODE:-000} /$KEY/$P"; fi
          done
          [ "$BAD" -eq 0 ] || { echo "::error::The application folder /$KEY/ is readable over HTTP (see the 200 lines above)."; exit 1; }
          echo "== Nothing in /$KEY/ is readable over HTTP."
