name: CI

# Runs on every pull request (whatever its base branch, so stacked PRs are covered) and on pushes to the trunk. It is also
# the release gate that deploy.yml calls. Jobs:
#
#   tests              PHPUnit on in-memory SQLite (Vite is faked), including the design:preflight tests.
#   js                 the JS suite, the Vite build, and the manifest check against every @vite entry in the views.
#                      The built assets go to the smoke job as an artifact, so the app is built once.
#   signed-in-smoke    boots the app like the live host (APP_ENV=production, cached routes/config/views, the BUILT assets),
#                      signs a seeded user in over HTTP and requests every key page and JSON endpoint plus the fonts and
#                      built assets (tests/Support/signed-in-smoke.sh).
#
# (A PostgreSQL job, owned by the performance work, may be added beside these; do not fold it into them.)
on:
  # Called by deploy.yml as the release gate.
  workflow_call: {}
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, gd, fileinfo

      # Composer's cache folder differs between runners (~/.composer/cache or ~/.cache/composer), so ask it.
      - name: Find the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      # .env must exist BEFORE composer install: package:discover boots the app,
      # and with no .env the broadcaster defaults to reverb with null credentials.
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          BROADCAST_CONNECTION: log
        run: ./vendor/bin/phpunit --colors=never

  js:
    name: js (tests, build, manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # No .env yet: no VITE_* variable is baked into the bundle, exactly like the deploy build.
      - name: Build
        run: npm run build

      - name: Every @vite entry is built, every manifest file exists
        run: node scripts/ops/check-vite-manifest.mjs

      # The editor entry chunk is a budget, not a hope (docs/R45_PERF.md): fail loudly if it grows past it.
      - name: Editor entry size budget
        run: node scripts/perf/bundle-budget.mjs

      - name: Keep the build for the smoke job
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          retention-days: 1
          if-no-files-found: error

      # Some JS suites call PHP (tests/js/library/templates-real.test.mjs reads config/design_fonts.php and the template
      # definitions through scripts/dev/*.php), so the tests run here with PHP and vendor/ installed. The build above
      # ran first and without a .env, so no VITE_* variable is baked into it.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, gd, fileinfo

      - name: Find the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Prepare PHP for the JS suites that call it
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate

      - name: JS tests
        run: npm run test:js

  signed-in-smoke:
    name: signed-in smoke (production-like boot)
    needs: js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, gd, fileinfo

      - name: Find the Composer cache folder
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      # The script sets its own production environment, database, storage and caches under a temp folder.
      - name: Signed-in smoke
        run: tests/Support/signed-in-smoke.sh

  # ==== R-45 perf: PostgreSQL parity (production runs PostgreSQL, the tests job above runs SQLite) ====
  pgsql-tests:
    name: PHP suite on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: design_perf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
          extensions: pgsql, pdo_pgsql, mbstring, intl, bcmath, curl, gd, exif, fileinfo

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      # phpunit.pgsql.xml mirrors phpunit.xml but connects to PostgreSQL; the DB_* values below win over its defaults.
      - name: Run tests on PostgreSQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: design_perf_ci
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test -c phpunit.pgsql.xml --compact
